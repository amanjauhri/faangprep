<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aastha's FAANG Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm study companion; clear, never noisy.
   IDEA: a course workbook: a contents page, chapters per track, numbered sections.
   PICTURE: the "today" spread: four track chapters side by side, each a numbered list of subtopics.
   COLOUR: white paper, near-black ink, ultramarine for navigation; one dark colour per track.
   TYPE: Spectral for titles, Inter for reading. LAYOUT: one reading column with a sticky contents rail on wide screens. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d0e18);--paper:light-dark(#f6f7fb,#151729);--line:light-dark(#d6d9e3,#2b2f48);
--ink:light-dark(#111827,#eef0f7);--ink2:light-dark(#1f2937,#d7dbe8);--accent:light-dark(#1d2bd8,#9aa6ff);
--dsa:light-dark(#047857,#5fd3a8);--java:light-dark(#0e7490,#5ccfe6);--design:light-dark(#6d28d9,#c4a8ff);--ai:light-dark(#c2410c,#ffab7a);
--tint:light-dark(#eef1ff,#1c2040);--codebg:#0f172a;--codefg:#f1f5f9}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Spectral,Georgia,serif;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);font-weight:600}h2{font-size:clamp(22px,3vw,28px);font-weight:600}h3{font-size:20px;font-weight:600}
a{color:var(--accent);font-weight:600}
button{font:inherit}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.top{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1240px;margin:0 auto;padding:12px max(4vw,14px);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.brand{font-family:Spectral,Georgia,serif;font-size:22px;font-weight:600;color:var(--ink);text-decoration:none}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.meter{width:160px;height:10px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
#nav{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px) 10px;display:flex;gap:6px;overflow-x:auto}
#nav a{flex:none;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--line);min-height:40px;display:inline-flex;align-items:center;gap:8px}
#nav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#nav a .dot{width:9px;height:9px;border-radius:50%}
main{max-width:1240px;margin:0 auto;padding:28px max(4vw,14px) 80px}
.lead{font-size:18px;color:var(--ink2);max-width:760px;margin:10px 0 0}
.eyebrow{font-size:14px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin-top:22px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}@media(min-width:900px){.g4{grid-template-columns:1fr 1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.card .tag{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.card h3{font-size:21px}
.card ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.card ol a{color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,#nav a:focus-visible,.rail a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:22px}
.dots{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.done-text{text-decoration:line-through;color:var(--ink2)}
.lesson{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;margin-top:20px}
.rail{position:sticky;top:120px;align-self:start;font-size:14px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 140px);overflow:auto}
.rail a{color:var(--ink);font-weight:500;text-decoration:none;padding:6px 10px;border-left:3px solid var(--line)}
.rail a:hover{border-left-color:var(--tc)}
.rail b{margin:12px 0 4px;font-size:13px}
.crumb{font-size:14px;color:var(--ink2)}.crumb a{color:var(--ink2)}
.why{border-left:4px solid var(--tc);background:var(--paper);padding:14px 18px;border-radius:0 12px 12px 0;margin-top:16px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:12px;font-size:15px}
.links div{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sub{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.sub .num{display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--tc);color:var(--bg);font-weight:700;align-items:center;justify-content:center;margin-right:10px;font-family:Inter,sans-serif;font-size:15px;flex:none}
.sub h2{display:flex;align-items:center}
.oneline{font-size:18px;font-weight:600;margin:12px 0}
.sub p{max-width:760px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px;max-width:780px}
.steps li{counter-increment:s;position:relative;padding:10px 14px 10px 52px;border:1px solid var(--line);border-radius:10px}
.steps li:before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:16px 0}
.flow .box{flex:1 1 140px;border:2px solid var(--tc);border-radius:10px;padding:10px 12px;background:var(--bg)}
.flow .box b{display:block}.flow .box span{font-size:14px;color:var(--ink2)}
.flow .arr{align-self:center;font-weight:700;color:var(--tc);font-size:20px}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}
th{background:var(--ink);color:var(--bg);text-align:left;padding:9px 10px;font-weight:600}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
.callout{border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:10px;padding:12px 16px;margin:14px 0;max-width:780px;background:var(--paper)}
.callout.warn{border-left-color:#b91c1c}.callout.work{border-left-color:var(--accent)}
.callout b{display:block;margin-bottom:4px}
.codewrap{position:relative;margin:14px 0}
pre{background:var(--codebg);color:var(--codefg);padding:16px;border-radius:10px;overflow-x:auto;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0}
.copy{position:absolute;top:8px;right:8px;min-height:32px;padding:4px 10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#f1f5f9;cursor:pointer;font-size:13px}
.prob{border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:18px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:700}
.Easy{background:#047857}.Medium{background:#b45309}.Hard{background:#b91c1c}
details{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--bg)}
summary{cursor:pointer;padding:12px 16px;font-weight:600;min-height:44px}
details>div{padding:0 16px 14px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:14px}
.row{display:grid;grid-template-columns:70px 110px minmax(0,1fr) 150px;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);align-items:center;color:var(--ink);text-decoration:none;font-weight:500}
a.row:hover{background:var(--paper)}
.row .st{font-size:13px;font-weight:700;text-align:right}
.row.locked{color:var(--ink2)}
.phase{margin-top:26px;font-size:15px;font-weight:700;color:var(--ink2)}
.news{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.news .meta{font-size:13px;font-weight:600;color:var(--ink2)}
.search{width:100%;max-width:420px;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:16px}
.gl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px}
.muted{color:var(--ink2);font-size:14px}
@media(max-width:860px){.lesson{grid-template-columns:1fr}.rail{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.rail b{width:100%}.rail a{border-left:0;border:1px solid var(--line);border-radius:999px}}
@media(max-width:600px){.row{grid-template-columns:52px minmax(0,1fr);}.row .dt,.row .st{grid-column:2;text-align:left}.gl{grid-template-columns:1fr}.meter{width:100px}table{font-size:13px}th,td{padding:7px}}
@media(prefers-reduced-motion:no-preference){.card,.prob{transition:border-color .2s}.card:hover{border-color:var(--ink2)}}
</style>
</head>
<body>
<header class="top">
 <div class="bar"><a class="brand" href="#today">Aastha's FAANG Prep</a>
  <div class="prog"><span id="dayinfo">Loading…</span><div class="meter" aria-hidden="true"><i id="meter" style="width:0"></i></div><span id="pct"></span></div></div>
 <nav id="nav" aria-label="Sections"></nav>
</header>
<main id="app"><p>Loading your plan…</p></main>
<script>
{
const TR={dsa:{name:"Coding patterns",c:"var(--dsa)"},java:{name:"Java & Spring",c:"var(--java)"},design:{name:"System design",c:"var(--design)"},ai:{name:"AI skills",c:"var(--ai)"}};
const ORDER=["dsa","java","design","ai"];
const app=document.getElementById("app");
let CUR=null,STATE=null,NEWS=null;const LES={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
const store={get(k,d){try{return JSON.parse(localStorage.getItem("fp_"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("fp_"+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
async function j(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(u);return r.json()}
async function lesson(n){if(!LES[n])LES[n]=await j(`data/lessons/day-${pad(n)}.json`);return LES[n]}
const done=()=>store.get("done",{});
function isDone(t,n){return !!done()[t+"-"+n]}
function toggleDone(t,n){const d=done();d[t+"-"+n]=!d[t+"-"+n];store.set("done",d);header()}
function header(){
 const L=STATE.latest_day,d=done(),cnt=Object.values(d).filter(Boolean).length;
 document.getElementById("dayinfo").textContent=`Day ${L} of 60 · ${CUR.days[L-1].phase}`;
 document.getElementById("meter").style.width=(cnt/240*100).toFixed(1)+"%";
 document.getElementById("pct").textContent=`${cnt}/240 lessons done`;
 const h=location.hash.slice(1)||"today";
 const items=[["today","Today"],["roadmap","60-day roadmap"],...ORDER.map(t=>["track-"+t,TR[t].name,TR[t].c]),["glossary","Glossary"],["news","AI news"]];
 document.getElementById("nav").innerHTML=items.map(([id,l,c])=>`<a href="#${id}" class="${h===id||h.startsWith(id.replace("track-","lesson-")+"-")?"on":""}">${c?`<span class="dot" style="background:${c}"></span>`:""}${esc(l)}</a>`).join("");
}
function block(b){
 switch(b.type){
  case"p":return`<p>${md(b.text)}</p>`;
  case"list":return`<ul>${b.items.map(i=>`<li>${md(i)}</li>`).join("")}</ul>`;
  case"steps":return`<ol class="steps">${b.items.map(i=>`<li>${md(i)}</li>`).join("")}</ol>`;
  case"table":return`<div class="scroll"><table class="stack"><thead><tr>${b.head.map(h=>`<th>${md(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${esc(b.head[i])}">${md(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  case"code":return codeBox(b.code);
  case"flow":return`<div class="flow">${b.items.map((it,i)=>`${i?'<span class="arr" aria-hidden="true">→</span>':""}<div class="box"><b>${md(it.label)}</b>${it.note?`<span>${md(it.note)}</span>`:""}</div>`).join("")}</div>`;
  case"callout":return`<div class="callout ${esc(b.tone||"")}"><b>${md(b.title)}</b>${md(b.text)}</div>`;
  case"compare":return`<div class="grid">${b.items.map(it=>`<div class="card"><h3>${md(it.title)}</h3><ul>${it.points.map(p=>`<li>${md(p)}</li>`).join("")}</ul></div>`).join("")}</div>`;
 }return""}
function codeBox(c){return`<div class="codewrap"><button class="copy" data-copy>Copy</button><pre><code style="background:none;border:0;padding:0;color:inherit">${esc(c)}</code></pre></div>`}
function viewToday(){
 const L=STATE.latest_day;
 lesson(L).then(les=>{
  const nx=CUR.days[L];
  const ck=store.get("check-"+L,{});
  app.innerHTML=`<p class="eyebrow">Day ${L} · ${fmt(les.date)} · ${esc(les.phase)}${STATE.note?` · ${esc(STATE.note)}`:""}</p>
  <h1>${esc(les.headline)}</h1><p class="lead">${md(les.intro)}</p>
  <div class="grid g4">${ORDER.map(t=>{const T=les.tracks[t];return`<article class="card" style="--tc:${TR[t].c};border-top:5px solid ${TR[t].c}">
   <div class="tag"><span style="color:${TR[t].c}">${TR[t].name}</span><span>${T.minutes} min · ${esc(T.level)}</span></div>
   <h3>${esc(T.title)}</h3>
   <ol>${T.subtopics.map(s=>`<li><a href="#lesson-${t}-${L}-${esc(s.id)}">${esc(s.title)}</a></li>`).join("")}</ol>
   ${t==="dsa"&&T.problems?`<p class="muted" style="margin:0">Practice: ${T.problems.map(p=>`${p.num} ${esc(p.title)} (${p.difficulty})`).join(", ")}</p>`:""}
   <div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#lesson-${t}-${L}">Open lesson</a>${isDone(t,L)?'<span class="muted" style="align-self:center">✓ Done</span>':""}</div></article>`}).join("")}</div>
  ${les.connections?`<section class="panel"><h3>How today's topics connect</h3><ul class="dots">${les.connections.map(c=>`<li>${md(c)}</li>`).join("")}</ul></section>`:""}
  <section class="panel"><h3>Today's checklist</h3>${les.checklist.map((c,i)=>`<label class="check"><input type="checkbox" data-ck="${i}" ${ck[i]?"checked":""}><span class="${ck[i]?"done-text":""}">${md(c)}</span></label>`).join("")}
   <p class="muted">Ticks are saved in this browser.</p></section>
  ${nx?`<section class="panel"><h3>Coming up: Day ${nx.day}, ${fmt(nx.date)}</h3><ul class="dots">${ORDER.map(t=>`<li><b style="color:${TR[t].c}">${TR[t].name}:</b> ${esc(nx[t].title)}</li>`).join("")}</ul></section>`:""}
  ${NEWS?`<section style="margin-top:28px"><h2>This week in AI</h2><div class="grid">${NEWS.items.slice(0,2).map(newsCard).join("")}</div><p><a href="#news">All AI news →</a></p></section>`:""}`;
  app.querySelectorAll("[data-ck]").forEach(x=>x.addEventListener("change",()=>{const c=store.get("check-"+L,{});c[x.dataset.ck]=x.checked;store.set("check-"+L,c);x.nextElementSibling.className=x.checked?"done-text":""}));
 }).catch(()=>app.innerHTML=`<h1>Today's lesson isn't ready yet</h1><p class="lead">It is published every morning at 9:00 IST.</p>`);
}
function viewTrack(t){
 const L=STATE.latest_day;
 let html=`<p class="eyebrow" style="color:${TR[t].c}">Track</p><h1>${TR[t].name}</h1><p class="lead">60 lessons, from basics to interview level. Lessons open on their day; everything after today shows its topic so you can see where it leads.</p><div class="rows" style="--tc:${TR[t].c}">`;
 let ph="";
 CUR.days.forEach(d=>{
  if(d.phase!==ph){ph=d.phase;const p=CUR.phases.find(x=>x.name===ph);html+=`</div><p class="phase">${esc(ph)} · days ${p.from}–${p.to}</p><div class="rows">`}
  const open=d.day<=L,dn=isDone(t,d.day);
  const sub=t==="dsa"?`<div class="muted">${esc(d.dsa.subtopics.join(" · "))}</div>`:"";
  html+=open?`<a class="row" href="#lesson-${t}-${d.day}"><b>Day ${d.day}</b><span class="dt muted">${fmt(d.date)}</span><span>${esc(d[t].title)}${sub}</span><span class="st" style="color:${TR[t].c}">${dn?"✓ Done":d.day===L?"Today":"Open"}</span></a>`
   :`<div class="row locked"><b>Day ${d.day}</b><span class="dt">${fmt(d.date)}</span><span>${esc(d[t].title)}${sub}</span><span class="st">Opens ${fmt(d.date)}</span></div>`;
 });
 app.innerHTML=html+"</div>";
}
function viewLesson(t,n,anchor){
 if(n>STATE.latest_day){app.innerHTML=`<h1>Not open yet</h1><p class="lead">Day ${n} opens on ${fmt(CUR.days[n-1].date)}.</p><p><a href="#track-${t}">Back to ${TR[t].name}</a></p>`;return}
 lesson(n).then(les=>{
  const T=les.tracks[t],c=TR[t].c;
  const rail=`<b>On this page</b>${T.subtopics.map((s,i)=>`<a href="#lesson-${t}-${n}-${esc(s.id)}">${i+1}. ${esc(s.title)}</a>`).join("")}${T.problems&&T.problems.length?`<a href="#lesson-${t}-${n}-practice">Practice problems</a>`:""}${T.prompt?`<a href="#lesson-${t}-${n}-prompt">Prompt to copy</a>`:""}<a href="#lesson-${t}-${n}-interview">Interview questions</a><a href="#lesson-${t}-${n}-recap">Recap and links</a>`;
  let h=`<p class="crumb"><a href="#track-${t}">${TR[t].name}</a> › Day ${n} · ${fmt(les.date)}</p>
  <h1>${esc(T.title)}</h1><p class="muted">${T.minutes} minutes · ${esc(T.level)} · ${T.subtopics.length} parts</p>
  <div class="why"><b>Why this matters</b><br>${md(T.why)}</div>
  <div class="links"><div><b>Builds on</b><br>${md(T.builds_on)}</div><div><b>Leads to</b><br>${md(T.next)}</div></div>`;
  T.subtopics.forEach((s,i)=>{h+=`<section class="sub" id="lesson-${t}-${n}-${esc(s.id)}"><h2><span class="num">${i+1}</span>${esc(s.title)}</h2><p class="oneline">${md(s.in_one_line)}</p>${s.blocks.map(block).join("")}</section>`});
  if(T.problems&&T.problems.length){h+=`<section class="sub" id="lesson-${t}-${n}-practice"><h2>Practice problems</h2><p>Spend up to 25 minutes on each before opening hints. Then ask your AI coach for a review.</p>${T.problems.map(prob).join("")}</section>`}
  if(T.prompt){h+=`<section class="sub" id="lesson-${t}-${n}-prompt"><h2>Prompt to copy</h2><p>Paste this into your Interview Coach chat.</p>${codeBox(T.prompt)}</section>`}
  h+=`<section class="sub" id="lesson-${t}-${n}-interview"><h2>Interview questions</h2><p>Answer out loud first, then open the model answer.</p>${T.interview_qa.map(q=>`<details><summary>${md(q.q)}</summary><div>${md(q.a)}</div></details>`).join("")}</section>
  <section class="sub" id="lesson-${t}-${n}-recap"><h2>Recap</h2><ul>${T.takeaways.map(x=>`<li>${md(x)}</li>`).join("")}</ul><h3 style="margin-top:18px">Go deeper</h3><ul>${T.resources.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></li>`).join("")}</ul>
  <p style="margin-top:20px"><button class="btn" id="mark">${isDone(t,n)?"✓ Marked done · undo":"Mark this lesson done"}</button></p></section>
  <div class="pager">${n>1?`<a class="btn ghost" href="#lesson-${t}-${n-1}">← Day ${n-1}: ${esc(CUR.days[n-2][t].title)}</a>`:"<span></span>"}${n<STATE.latest_day?`<a class="btn ghost" href="#lesson-${t}-${n+1}">Day ${n+1} →</a>`:`<span class="muted">Next: ${esc((CUR.days[n]||{})[t]?.title||"")}${CUR.days[n]?" · opens "+fmt(CUR.days[n].date):""}</span>`}</div>`;
  app.innerHTML=`<div class="lesson" style="--tc:${c}"><nav class="rail" aria-label="Lesson contents">${rail}</nav><div>${h}</div></div>`;
  document.getElementById("mark").onclick=()=>{toggleDone(t,n);viewLesson(t,n)};
  const el=anchor&&document.getElementById(anchor);if(el)el.scrollIntoView();else scrollTo(0,0);
 }).catch(()=>app.innerHTML=`<h1>Lesson not found</h1><p><a href="#today">Back to today</a></p>`);
}
function prob(p){
 return`<article class="prob"><p style="margin:0"><span class="badge ${esc(p.difficulty)}">${esc(p.difficulty)}</span> <b style="font-size:19px">&nbsp;${p.num}. ${esc(p.title)}</b></p>
 <p>${md(p.statement)}</p><p><b>Example:</b> ${md(p.example)}</p>
 <p><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Solve on LeetCode</a></p>
 <details><summary>How to think about it</summary><div><ol class="steps">${p.how_to_think.map(x=>`<li>${md(x)}</li>`).join("")}</ol></div></details>
 <details><summary>Hints (open one at a time)</summary><div>${p.hints.map((x,i)=>`<details><summary>Hint ${i+1}</summary><div>${md(x)}</div></details>`).join("")}</div></details>
 <details><summary>Solution (after 25 minutes)</summary><div><ol class="steps">${p.solution.approach.map(x=>`<li>${md(x)}</li>`).join("")}</ol>${codeBox(p.solution.code)}<p><b>Time:</b> ${md(p.solution.time)}<br><b>Space:</b> ${md(p.solution.space)}</p>
 ${p.alternatives?`<div class="scroll"><table class="stack"><thead><tr><th>Approach</th><th>Time</th><th>Space</th><th>When to use</th></tr></thead><tbody>${p.alternatives.map(a=>`<tr><td data-l="Approach">${md(a.name)}</td><td data-l="Time">${md(a.time)}</td><td data-l="Space">${md(a.space)}</td><td data-l="When to use">${md(a.note)}</td></tr>`).join("")}</tbody></table></div>`:""}</div></details>
 ${p.followups?`<details><summary>Follow-up questions</summary><div>${p.followups.map(f=>`<p><b>${md(f.q)}</b><br>${md(f.a)}</p>`).join("")}</div></details>`:""}</article>`}
function viewRoadmap(){
 const L=STATE.latest_day;
 app.innerHTML=`<h1>The 60-day roadmap</h1><p class="lead">Four tracks run side by side every day, each starting from the basics. Sundays are off. Day ${L} is today.</p>
 ${CUR.phases.map(p=>`<p class="phase">${esc(p.name)} · days ${p.from}–${p.to}</p><div class="scroll"><table class="stack"><thead><tr><th>Day</th>${ORDER.map(t=>`<th>${TR[t].name}</th>`).join("")}</tr></thead><tbody>${CUR.days.slice(p.from-1,p.to).map(d=>`<tr${d.day===L?' style="background:var(--tint)"':""}><td data-l="Day"><b>${d.day}</b><br><span class="muted">${fmt(d.date)}</span></td>${ORDER.map(t=>`<td data-l="${TR[t].name}">${d.day<=L?`<a href="#lesson-${t}-${d.day}">${esc(d[t].title)}</a>`:esc(d[t].title)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`).join("")}`;
}
async function viewGlossary(){
 const L=STATE.latest_day,all=[];
 for(let n=1;n<=L;n++){try{(await lesson(n)).glossary.forEach(g=>all.push({...g,day:n}))}catch(e){}}
 all.sort((a,b)=>a.term.localeCompare(b.term));
 app.innerHTML=`<h1>Glossary</h1><p class="lead">Every term introduced so far, in plain words. It grows each day.</p><input class="search" id="q" type="search" placeholder="Search terms" aria-label="Search terms"><div id="gl"></div>`;
 const draw=q=>{document.getElementById("gl").innerHTML=all.filter(g=>(g.term+g.meaning).toLowerCase().includes(q)).map(g=>`<div class="gl"><b>${esc(g.term)}</b><span>${md(g.meaning)} <span class="muted">(Day ${g.day})</span></span></div>`).join("")||'<p class="muted">No matching terms.</p>'};
 draw("");document.getElementById("q").addEventListener("input",e=>draw(e.target.value.toLowerCase()));
}
const newsCard=i=>`<article class="news"><p class="meta">${esc(i.tag)} · ${fmt(i.date)} · ${esc(i.source)}</p><h3>${esc(i.headline)}</h3><p>${md(i.summary)}</p><p><b>Why it matters for you:</b> ${md(i.why)}</p><a href="${esc(i.url)}" target="_blank" rel="noopener">Read the source</a></article>`;
function viewNews(){app.innerHTML=`<h1>AI news, explained for your job search</h1><p class="lead">Refreshed every morning. Updated ${esc(new Date(NEWS.updated).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}.</p><div class="grid">${NEWS.items.map(newsCard).join("")}</div>`}
function route(){
 header();
 const h=location.hash.slice(1)||"today";let m;
 if(h==="today")viewToday();
 else if(h==="roadmap")viewRoadmap();
 else if(h==="glossary")viewGlossary();
 else if(h==="news")viewNews();
 else if(m=h.match(/^track-(dsa|java|design|ai)$/))viewTrack(m[1]);
 else if(m=h.match(/^lesson-(dsa|java|design|ai)-(\d+)(?:-([a-z0-9-]+))?$/))viewLesson(m[1],+m[2],m[3]?h:null);
 else viewToday();
 if(!h.startsWith("lesson-"))scrollTo(0,0);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;const t=b.nextElementSibling.textContent;try{navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)},()=>{b.textContent="Select and copy"})}catch(err){b.textContent="Select and copy"}});
addEventListener("hashchange",route);
Promise.all([j("data/curriculum.json"),j("data/state.json"),j("data/news.json").catch(()=>null)]).then(([c,s,n])=>{CUR=c;STATE=s;NEWS=n;route()}).catch(()=>app.innerHTML="<h1>Could not load the plan</h1><p class='lead'>Please refresh the page.</p>");
}
</script>
</body>
</html>
